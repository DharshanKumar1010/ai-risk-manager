# Alembic configuration for the RiskIQ backend.
#
# There is deliberately no `sqlalchemy.url` key here. The DSN carries a password, and this
# file is tracked — see .claude/skills/security-checklist/SKILL.md section 1. alembic/env.py
# reads the URL from app.config.Settings, which loads it from the environment or .env.
#
# Run from the backend/ directory:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "description"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Revisions are named <rev>_<slug>.py so the versions/ directory reads in build order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
