[project]
name = "riskiq-backend"
version = "0.1.0"
description = "RiskIQ — real-time fraud, chargeback and abuse-ring detection."
requires-python = ">=3.11,<3.12"

# ---------------------------------------------------------------------------
# Ruff — lint. Rule sets fixed by CLAUDE.md: E, F, I, N, W, B.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["../notebooks", "../data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Router and tier modules are documented stubs in Phase 0; their imports become used
# as each phase implements them.
"app/models/*.py" = ["F401"]

# ---------------------------------------------------------------------------
# Black — formatting.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Mypy — strict. Every function in app/ carries full annotations.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "redis.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
