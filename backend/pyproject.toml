[project]
name = "riskiq-backend"
version = "0.1.0"
description = "RiskIQ — real-time fraud, chargeback and abuse-ring detection."
requires-python = ">=3.11,<3.12"

# ---------------------------------------------------------------------------
# Ruff — lint. Rule sets fixed by CLAUDE.md: E, F, I, N, W, B.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["../notebooks", "../data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Table modules are imported for their side effect of registering against Base.metadata,
# which is what makes them visible to Alembic autogeneration. Narrowed from the Phase 0
# blanket `app/models/*.py` now that the table modules carry real, used imports — the
# remaining tier stubs should not get a free pass on unused imports.
"app/models/__init__.py" = ["F401"]

# ---------------------------------------------------------------------------
# Black — formatting.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Mypy — strict. Every function in app/ carries full annotations.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "redis.*"]
ignore_missing_imports = true

# These ML libraries ship no py.typed marker and have no stub package. Deliberately scoped
# to them alone: pandas is typed via pandas-stubs, so the data layer stays strictly checked.
# If a call site is genuinely unworkable, use a targeted `# type: ignore[code]` with a
# reason rather than widening this list.
#
# Untyped here means every expression touching one of these is `Any`, so the boundary is
# kept narrow: model objects are held behind our own annotated wrappers (Tier1Model,
# CostModel, EvaluationResult) rather than passed around raw.
[[tool.mypy.overrides]]
module = ["sklearn.*", "pyarrow.*", "joblib.*", "lightgbm.*", "shap.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # starlette's TestClient still touches the deprecated anyio.abc.BlockingPortal alias --
    # an upstream compatibility lag between starlette and anyio, not anything this project's
    # own code does. Narrowly matched on the exact message so every other warning still errors.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
